name: Build blog
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blog-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run writer:test
      - run: npm run site:test
      - run: npm run writer:build
      - run: npm run build
      - run: npm run check
      - run: node tools/check-academic.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hexo-site
          path: public/
      - uses: actions/upload-pages-artifact@v3
        if: vars.WEB_WRITER_ENABLED == 'true'
        with:
          path: public/
  deploy:
    if: vars.WEB_WRITER_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

